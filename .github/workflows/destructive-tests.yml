name: Destructive Command Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build tw
        run: go build -o tw ./cmd/tw/

      - name: Upload tw binary
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tw-binary
          path: tw
          retention-days: 1

  test:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        pack:
          - ai
          - api-gateway
          - backup
          - bypass
          - cdn
          - cicd
          - cloud
          - containers
          - context
          - core
          - database
          - dns
          - email
          - feature-flags
          - hook-protocol
          - infrastructure
          - interpreters
          - kubernetes
          - load-balancer
          - macos
          - messaging
          - monitoring
          - packages
          - payment
          - platform
          - remote
          - search
          - secrets
          - storage
          - strict-git
          - system
          - windows
    name: test (${{ matrix.pack }})
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download tw binary
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: tw-binary

      - name: Install tw
        run: chmod +x tw && sudo mv tw /usr/local/bin/tw

      - name: Configure tw for tests
        run: echo "TW_PACKS_ENABLED=core,database,cloud,containers,kubernetes,infrastructure,system,remote,secrets,package_managers,platform,cicd,search,interpreters,dns,email,messaging,monitoring,storage,payment,cdn,apigateway,backup,featureflags,loadbalancer,ai,strict_git,windows" >> "$GITHUB_ENV"

      - name: Run ${{ matrix.pack }} tests
        run: .github/scripts/run-destructive-tests.sh .github/scripts/tests/test-${{ matrix.pack }}.sh

      - name: Upload failure report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: failures-${{ matrix.pack }}
          path: /tmp/tw-destructive-failures.txt
